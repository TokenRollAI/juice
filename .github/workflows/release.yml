name: Release npm Packages

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish @tokenroll/juice & @tokenroll/juice-vue
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Install, build, typecheck & test
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          pnpm typecheck
          pnpm test

      - name: Verify package versions match tag
        shell: bash
        run: |
          set -euo pipefail
          expected="${GITHUB_REF_NAME#v}"
          react_ver="$(node -p "require('./packages/juice/package.json').version")"
          vue_ver="$(node -p "require('./packages/vue/package.json').version")"
          test "${react_ver}" = "${expected}"
          test "${vue_ver}" = "${expected}"

      - name: Publish @tokenroll/juice to npm (OIDC Trusted Publishing)
        shell: bash
        run: |
          set -euo pipefail
          expected="${GITHUB_REF_NAME#v}"
          if npm view "@tokenroll/juice@${expected}" version >/dev/null 2>&1; then
            echo "@tokenroll/juice@${expected} already published — skipping"
          else
            pnpm --filter @tokenroll/juice publish --access public --no-git-checks
          fi

      - name: Publish @tokenroll/juice-vue to npm (OIDC Trusted Publishing)
        shell: bash
        run: |
          set -euo pipefail
          expected="${GITHUB_REF_NAME#v}"
          if npm view "@tokenroll/juice-vue@${expected}" version >/dev/null 2>&1; then
            echo "@tokenroll/juice-vue@${expected} already published — skipping"
          else
            pnpm --filter @tokenroll/juice-vue publish --access public --no-git-checks
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
